version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: weekender_postgres
    environment:
      POSTGRES_USER: weekender
      POSTGRES_PASSWORD: weekender
      POSTGRES_DB: weekender_dev
    ports:
      - '5432:5432'
    volumes:
      - weekender_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weekender -d weekender_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weekender_redis
    ports:
      - '6379:6379'
    volumes:
      - weekender_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  weekender_pgdata:
  weekender_redisdata:
