name: weekender
description: "Weekender — Activity-first social platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # Storage
  flutter_secure_storage: ^9.2.2

  # UI
  cupertino_icons: ^1.0.8

  # Media
  image_picker: ^1.1.2

  # Phase 5: Stream Chat — full UI widgets for group messaging
  # 10.4.0 requires Dart ^3.12.0 and Flutter >=3.44.0 (both satisfied)
  stream_chat_flutter: ^10.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  generate: true   # enables l10n ARB generation
